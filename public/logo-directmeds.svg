<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" role="img" aria-label="DirectMeds">
  <!-- icon group, vertically centered -->
  <g transform="translate(2 8)">
    <!-- Mortar & pestle -->
    <g fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 27 H55"/>
      <path d="M11 27 C11 43 19 51 30 51 C41 51 49 43 49 27"/>
      <line x1="35" y1="31" x2="52" y2="9"/>
    </g>
    <!-- pestle tip -->
    <circle cx="54" cy="6.5" r="5" fill="#00AEEF"/>
    <!-- blue medical cross inside the bowl -->
    <g fill="#00AEEF">
      <rect x="26" y="33" width="8" height="15" rx="1.5"/>
      <rect x="22.5" y="37" width="15" height="7" rx="1.5"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="66" y="49" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#111111">Direct</tspan><tspan fill="#00AEEF">Meds</tspan><tspan fill="#111111" font-size="13" dy="-18">™</tspan>
  </text>
</svg>
